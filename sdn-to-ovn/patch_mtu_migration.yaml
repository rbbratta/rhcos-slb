---
- hosts: all
  become: yes
  strategy: free
  # speedup
  gather_facts: no

  tasks:
    - name: Create directory for mtu-migration.service drop-in files
      file:
        path: /etc/systemd/system/mtu-migration.service.d
        state: directory
        mode: '0755'

    - name: Create override configuration file for mtu-migration.service
      copy:
        dest: /etc/systemd/system/mtu-migration.service.d/override.conf
        content: |
          [Unit]
          After=wait-for-primary-ip.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd to apply new configuration
      command: systemctl daemon-reload
